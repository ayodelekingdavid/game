<!DOCTYPE html>
<html lang="en">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Document</title>
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="container mt-4">
   <h1 class="text-center">Calculator</h1>

   <div class="mb-3 mt-3">
      <label for="input value" class="form-label">input value:</label>
      <input id="num1" class="form-control" id="input value" placeholder="Enter value" name="email">
   </div>
   <div class="mb-3">
      <label for="inputvalue " class="form-label">input value:</label>
      <input id="num 2" class="form-control" id="input value" placeholder="Enter value" name="input value">
   </div>

   <div class="mb-3">
      <label for="inputvalue " class="form-label">input value:</label>
      <input id="operand" class="form-control" id="operand" placeholder="Enter operand eg: +, -, *, /"
         name="input value">
   </div>


   <button onclick="add()" class="btn btn-primary text-white">result</button>
   <h1 id="result" class=" mt-3 bg-dark text-white"></h1>

   <script>
      function add() {
         a = document.getElementById("num1").value;
         b = document.getElementById("num 2").value;
         op = document.getElementById("operand").value;

         if (op == "+") {
            c = parseInt(a) + parseInt(b);

            document.getElementById("result").innerText = c;
         }
         else if (op == "-") {
            c = parseInt(a) - parseInt(b);
            document.getElementById("result").innerText = c;
         }
         else if (op == "*") {
            c = parseInt(a) * parseInt(b);
            document.getElementById("result").innerText = c;
         }
         else if (op == "/") {
            c = parseInt(a) / parseInt(b);
            document.getElementById("result").innerText = c;
         }
         else {
            document.getElementById("result").innerText = "Invalid operand";
         }
         c = parseInt(a) + parseInt(b);
         document.getElementById("add").innerText = c;
      }
   </script>
</body>

</html
