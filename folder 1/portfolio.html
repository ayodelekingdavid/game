<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>KingDavid Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <nav>
      <ul>
        <li><a href="#home">Home</a></li>
        <li><a href="#about">About</a></li>
        <li><a href="#work">Work</a></li>
        <li><a href="#resume">Resume</a></li>
        <li><a href="#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <section id="about">
    <h2>About Me</h2>
    <p>Hello, I’m KingDavid. This is my portfolio site.</p>
  </section>

  <section id="work">
    <h2>My Work</h2>
    <video controls>
      <source src="myvideo.mp4" type="video/mp4">
    </video>
  </section>

  <section id="resume">
    <h2>Resume</h2>
    <table>
      <tr>
        <th>Year</th>
        <th>Experience</th>
      </tr>
      <tr>
        <td>2025</td>
        <td>Frontend Developer Intern</td>
      </tr>
    </table>
  </section>

  <section id="contact">
    <h2>Contact Me</h2>
    <form>
      <label>Name: <input type="text" name="name"></label><br>
      <label>Email: <input type="email" name="email"></label><br>
      <textarea name="message" placeholder="Your message"></textarea><br>
      <button type="submit">Send</button>
    </form>
  </section>

  <footer>
    <p>&copy; 2026 KingDavid Portfolio</p>
  </footer>
</body>

</html>
