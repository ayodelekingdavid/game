```html
<!DOCTYPE html>
<html>
<head>
    <title>Quiz</title>
</head>

<body>

    <h1>Quiz</h1>

    <h2>What is the capital of Nigeria?</h2>

    <label>
        <input type="radio" name="answer" value="Lagos">
        Lagos
    </label>
    <br>

    <label>
        <input type="radio" name="answer" value="Abuja">
        Abuja
    </label>
    <br>

    <label>
        <input type="radio" name="answer" value="Kano">
        Kano
    </label>
    <br>

    <label>
        <input type="radio" name="answer" value="Ibadan">
        Ibadan
    </label>

    <br><br>

    <button onclick="checkAnswer()">Submit Answer</button>

    <p id="result"></p>

    <script>
        function checkAnswer() {

            let selected = document.querySelector(
                'input[name="answer"]:checked'
            );

            let result = document.getElementById("result");

            if (!selected) {
                result.textContent = "Please select an answer.";
                return;
            }

            if (selected.value === "Abuja") {
                result.textContent = "Correct! ✅";
            } else {
                result.textContent = "Wrong! ❌";
            }
        }
    </script>

</body>
</html>
```
